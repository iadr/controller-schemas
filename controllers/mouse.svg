  <title id="title">Five button mouse</title><desc id="desc">Mouse with individually identified primary, wheel and side buttons.</desc>
  <defs><style>.body{fill:#d3d3d3;stroke:#3e4b50;stroke-width:5}.button{fill:#fff;stroke:#3e4b50;stroke-width:4}.detail{fill:#3e4b50}.label{fill:#3e4b50;font:600 12px Arial,sans-serif;text-anchor:middle;pointer-events:none}</style><filter id="shadow" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".2"/></filter></defs>
  <path class="body" d="M120 12C59 12 24 57 24 120v134c0 68 40 114 96 114s96-46 96-114V120C216 57 181 12 120 12Z" filter="url(#shadow)"/>
